<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body data-accent="{{ site.accent | default: 'blue' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
  <button class="back-to-top" type="button" data-back-to-top aria-label="Back to top" hidden>
    {% include icon.html name="chevron-up" size=14 %}
  </button>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
