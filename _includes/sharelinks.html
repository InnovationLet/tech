{% assign share_url = page.url | absolute_url | url_encode %}
{% assign share_title = page.title | url_encode %}
<div class="share">
  <span class="share__label">Share</span>
  <a class="share__btn" rel="noopener nofollow" target="_blank" title="Share on X"
     href="https://twitter.com/intent/tweet?url={{ share_url }}&text={{ share_title }}&via={{ site.twitter_username }}">
    X
  </a>
  <a class="share__btn" rel="noopener nofollow" target="_blank" title="Share on LinkedIn"
     href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}">
    LinkedIn
  </a>
  <a class="share__btn" rel="noopener nofollow" target="_blank" title="Share on Facebook"
     href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}">
    Facebook
  </a>
  <a class="share__btn" rel="noopener nofollow" title="Share by email"
     href="mailto:?subject={{ share_title }}&body={{ share_url }}">
    Email
  </a>
</div>
