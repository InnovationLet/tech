<nav class="post-navi" aria-label="Post navigation">
  {% if page.previous.url %}
  <a class="post-navi__item post-navi__prev" href="{{ page.previous.url | relative_url }}" rel="prev">
    <span class="post-navi__label">Newer</span>
    <span class="post-navi__title">{{ page.previous.title | escape }}</span>
  </a>
  {% else %}
  <a class="post-navi__item post-navi__prev" href="{{ '/archive.html' | relative_url }}">
    <span class="post-navi__label">Back to</span>
    <span class="post-navi__title">All stories</span>
  </a>
  {% endif %}

  {% if page.next.url %}
  <a class="post-navi__item post-navi__next" href="{{ page.next.url | relative_url }}" rel="next">
    <span class="post-navi__label">Older</span>
    <span class="post-navi__title">{{ page.next.title | escape }}</span>
  </a>
  {% else %}
  <a class="post-navi__item post-navi__next" href="{{ '/archive.html' | relative_url }}">
    <span class="post-navi__label">Browse</span>
    <span class="post-navi__title">The full archive</span>
  </a>
  {% endif %}
</nav>
